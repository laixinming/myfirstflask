<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>共享画廊 · 自动循环视频</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 样式完全沿用之前版本，包含图片放大遮罩层 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #121212;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow: hidden;
            touch-action: pan-y pinch-zoom; 
        }

        .cards-container {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            gap: 0;
            height: 95dvh;
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            border-radius: 32px 32px 24px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            white-space: nowrap;
        }

        .cards-container::-webkit-scrollbar {
            display: none;
        }

        .card {
            flex: 0 0 100%;
            scroll-snap-align: start;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border-radius: 24px;
            padding: 16px 16px 16px 16px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.05);
            color: #f0f0f0;
            overflow-y: auto;
            white-space: normal;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }
        .card-index {
            font-size: 14px;
            color: #9a9a9a;
            background: #2c2c2c;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #3f3f3f;
        }
        .delete-card-btn {
            background: #2c2c2c;
            border: 1px solid #5a3e3e;
            color: #ff8a8a;
            width: 42px;
            height: 42px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1;
        }
        .delete-card-btn:active {
            background: #4a2e2e;
            border-color: #ff6b6b;
            color: #ffc5c5;
            transform: scale(0.92);
        }

        .media-block {
            position: relative;
            background: #2a2a2a;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
            min-height: 150px;
        }

        .card-image {
            flex: 1.2;
            max-height: 28%;
        }
        .card-video {
            flex: 1.5;
            max-height: 32%;
        }
        .card-markdown {
            flex: 2.2;
            min-height: 150px;
            margin-bottom: 0;
        }

        .plus-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 56px;
            font-weight: 300;
            color: #888;
            background: #2a2a2a;
            border-radius: 20px;
            cursor: pointer;
            min-height: 140px;
        }
        .plus-placeholder span {
            font-size: 18px;
            margin-top: 8px;
            color: #aaa;
        }
        .plus-placeholder:active {
            background: #3a3a3a;
        }

        .media-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #1f1f1f;
        }
        .media-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a1a;
            border-radius: 18px;
            display: block;
            cursor: pointer;
        }
        .media-content video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0f0f0f;
            border-radius: 18px;
        }

        .markdown-body {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 16px 14px;
            background: #252525;
            border-radius: 18px;
            color: #e6e6e6;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            scrollbar-width: thin;
            white-space: normal;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #ffb86b;
            margin: 0.3em 0;
        }
        .markdown-body p {
            margin: 0.6em 0;
        }
        .markdown-body a {
            color: #8be9fd;
        }
        .markdown-body code {
            background: #3d3d3d;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .message-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #aaa;
            font-style: italic;
            background: #2a2a2a;
            border-radius: 18px;
            padding: 12px;
        }

        .edit-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 38px;
            height: 38px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .edit-icon:active {
            background: rgba(120, 120, 120, 0.9);
            transform: scale(0.92);
        }
        .edit-icon::before {
            content: "✎";
            font-size: 22px;
            line-height: 1;
        }

        .media-block.empty .edit-icon {
            display: none;
        }

        /* 图片放大遮罩层 */
        #imageOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #overlayImage {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="cards-container" id="cardsContainer"></div>
    <div id="imageOverlay" onclick="this.style.display='none'">
        <img id="overlayImage" src="" alt="">
    </div>

    <script>
        (function() {
            const CONTAINER = document.getElementById('cardsContainer');
            let cards = [];
            let nextId = 1000;

            // API 调用（与之前相同）
            async function fetchCards() {
                try {
                    const res = await fetch('/api/cards');
                    const data = await res.json();
                    cards = data.cards || [];
                    cards = cards.map(c => ({ ...c, markdownHtml: c.markdownHtml || '' }));
                    if (cards.length === 0) {
                        cards = [createEmptyCard()];
                        await syncCardToServer(cards[0]);
                    }
                    const maxId = cards.reduce((max, c) => Math.max(max, c.id), 1000);
                    nextId = maxId + 1;
                    renderAllCards();
                } catch (err) {
                    console.error('Failed to fetch cards', err);
                    alert('无法加载数据，请刷新重试');
                }
            }

            async function syncCardToServer(card) {
                try {
                    await fetch('/api/card', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ card })
                    });
                } catch (err) {
                    console.error('Failed to sync card', err);
                }
            }

            async function deleteCardOnServer(cardId) {
                try {
                    await fetch('/api/card', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cardId })
                    });
                } catch (err) {
                    console.error('Failed to delete card', err);
                }
            }

            function createEmptyCard() {
                return {
                    id: nextId++,
                    imageUrl: null,
                    videoUrl: null,
                    markdownUrl: null,
                    markdownHtml: ''
                };
            }

            function findCardIndex(cardId) {
                return cards.findIndex(c => c.id === cardId);
            }

            function renderAllCards() {
                let htmlStr = '';
                cards.forEach(card => {
                    htmlStr += `
                        <div class="card" data-card-id="${card.id}">
                            <div class="card-header">
                                <span class="card-index">#${cards.findIndex(c => c.id === card.id) + 1}</span>
                                <span class="delete-card-btn" data-card-id="${card.id}" title="删除整组">🗑️</span>
                            </div>
                            <div class="media-block card-image" data-card-id="${card.id}"></div>
                            <div class="media-block card-video" data-card-id="${card.id}"></div>
                            <div class="media-block card-markdown" data-card-id="${card.id}"></div>
                        </div>
                    `;
                });
                CONTAINER.innerHTML = htmlStr;

                cards.forEach(card => {
                    renderSingleField(card.id, 'imageUrl');
                    renderSingleField(card.id, 'videoUrl');
                    renderSingleField(card.id, 'markdownUrl');
                });
            }

            function renderSingleField(cardId, field) {
                const card = cards.find(c => c.id === cardId);
                if (!card) return;

                const cardElement = document.querySelector(`.card[data-card-id="${cardId}"]`);
                if (!cardElement) return;

                let blockElement = null;
                if (field === 'imageUrl') blockElement = cardElement.querySelector('.card-image');
                else if (field === 'videoUrl') blockElement = cardElement.querySelector('.card-video');
                else if (field === 'markdownUrl') blockElement = cardElement.querySelector('.card-markdown');
                if (!blockElement) return;

                const url = card[field];

                if (!url) {
                    blockElement.classList.add('empty');
                    blockElement.innerHTML = `
                        <div class="plus-placeholder" data-field="${field}" data-card-id="${cardId}">
                            <div>➕</div>
                            <span>添加 ${field === 'imageUrl' ? '图片' : (field === 'videoUrl' ? '视频' : 'Markdown')}</span>
                        </div>
                    `;
                    return;
                }

                blockElement.classList.remove('empty');
                let contentHtml = '';

                if (field === 'imageUrl') {
                    contentHtml = `<img src="${escapeHtml(url)}" alt="image" loading="lazy" onerror="this.style.opacity=0.5; this.alt='❌加载失败'">`;
                } else if (field === 'videoUrl') {
                    // 关键修改：添加 autoplay loop muted 实现自动循环播放
                    contentHtml = `<video src="${escapeHtml(url)}" controls autoplay loop muted playsinline preload="metadata" onerror="this.outerHTML='<div class=\'message-placeholder\'>❌ 视频无法加载</div>'"></video>`;
                } else if (field === 'markdownUrl') {
                    if (card.markdownHtml) {
                        contentHtml = `<div class="markdown-body">${card.markdownHtml}</div>`;
                    } else {
                        contentHtml = `<div class="message-placeholder">⌛ 加载Markdown...</div>`;
                        fetchMarkdownAndRender(card, blockElement);
                    }
                }

                blockElement.innerHTML = `
                    <div class="media-content">
                        ${contentHtml}
                        <div class="edit-icon" data-field="${field}" data-card-id="${cardId}" title="修改链接"></div>
                    </div>
                `;
            }

            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            async function fetchMarkdownAndRender(card, blockElement) {
                const url = card.markdownUrl;
                if (!url) return;
                try {
                    const response = await fetch(url, { mode: 'cors', credentials: 'omit' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    const html = marked.parse(text, { mangle: false, headerIds: false });
                    card.markdownHtml = html;
                    const freshBlock = document.querySelector(`.card[data-card-id="${card.id}"] .card-markdown`);
                    if (freshBlock) {
                        freshBlock.innerHTML = `
                            <div class="media-content">
                                <div class="markdown-body">${html}</div>
                                <div class="edit-icon" data-field="markdownUrl" data-card-id="${card.id}"></div>
                            </div>
                        `;
                    }
                    await syncCardToServer(card);
                } catch (err) {
                    console.warn('markdown加载失败', err);
                    card.markdownHtml = '';
                    const errorBlock = document.querySelector(`.card[data-card-id="${card.id}"] .card-markdown .media-content`);
                    if (errorBlock) {
                        errorBlock.innerHTML = `
                            <div class="message-placeholder">⚠️ 加载失败，点击✎重试</div>
                            <div class="edit-icon" data-field="markdownUrl" data-card-id="${card.id}"></div>
                        `;
                    }
                }
            }

            async function setCardField(cardId, field, newUrl) {
                const idx = findCardIndex(cardId);
                if (idx === -1) return;
                const card = cards[idx];

                if (card[field] === newUrl) return;

                if (field === 'imageUrl' || field === 'videoUrl') {
                    card[field] = newUrl;
                } else if (field === 'markdownUrl') {
                    card[field] = newUrl;
                    card.markdownHtml = '';
                }

                renderSingleField(cardId, field);
                await syncCardToServer(card);

                maybeAppendNewCard(cardId);
            }

            async function maybeAppendNewCard(updatedCardId) {
                const lastCard = cards[cards.length - 1];
                if (lastCard.id !== updatedCardId) return;

                if (lastCard.imageUrl && lastCard.videoUrl && lastCard.markdownUrl) {
                    const newCard = createEmptyCard();
                    cards.push(newCard);
                    await syncCardToServer(newCard);
                    renderAllCards();
                    setTimeout(() => {
                        const newIndex = cards.length - 1;
                        CONTAINER.scrollTo({
                            left: newIndex * CONTAINER.clientWidth,
                            behavior: 'smooth'
                        });
                    }, 50);
                }
            }

            async function deleteCard(cardId) {
                const idx = findCardIndex(cardId);
                if (idx === -1) return;

                cards.splice(idx, 1);
                if (cards.length === 0) {
                    cards.push(createEmptyCard());
                }

                renderAllCards();
                await deleteCardOnServer(cardId);

                let targetIndex = idx;
                if (targetIndex >= cards.length) targetIndex = cards.length - 1;
                if (targetIndex < 0) targetIndex = 0;

                setTimeout(() => {
                    CONTAINER.scrollTo({
                        left: targetIndex * CONTAINER.clientWidth,
                        behavior: 'smooth'
                    });
                }, 30);
            }

            // 事件委托
            CONTAINER.addEventListener('click', async (e) => {
                if (e.target.closest('.delete-card-btn')) {
                    const btn = e.target.closest('.delete-card-btn');
                    const cardId = Number(btn.dataset.cardId);
                    if (confirm('确定删除这组内容吗？')) {
                        await deleteCard(cardId);
                    }
                    e.preventDefault();
                    return;
                }

                const plus = e.target.closest('.plus-placeholder');
                const edit = e.target.closest('.edit-icon');

                let field = null;
                let cardId = null;

                if (plus) {
                    field = plus.dataset.field;
                    cardId = Number(plus.dataset.cardId);
                } else if (edit) {
                    field = edit.dataset.field;
                    cardId = Number(edit.dataset.cardId);
                } else {
                    return;
                }

                e.preventDefault();

                const fieldNames = {
                    imageUrl: '图片链接 (直接图片地址, 如 https://...jpg)',
                    videoUrl: '视频链接 (支持.mp4等, 如 https://...mp4)',
                    markdownUrl: 'Markdown文件链接 (.md 文件地址)'
                };
                const currentCard = cards.find(c => c.id === cardId);
                const currentUrl = currentCard ? currentCard[field] : '';
                const promptMsg = `输入${fieldNames[field]}:\n(留空或取消则不变更)`;

                let newUrl = prompt(promptMsg, currentUrl || '');
                if (newUrl === null) return;
                newUrl = newUrl.trim();
                if (newUrl === '') newUrl = null;

                await setCardField(cardId, field, newUrl);
            });

            // 双击图片放大
            document.addEventListener('dblclick', function(e) {
                const img = e.target.closest('img');
                if (!img) return;
                if (!img.closest('.card')) return;
                const overlay = document.getElementById('imageOverlay');
                const overlayImg = document.getElementById('overlayImage');
                overlayImg.src = img.src;
                overlay.style.display = 'flex';
                e.preventDefault();
            });

            // 初始化
            fetchCards();
        })();
    </script>
</body>
</html>
