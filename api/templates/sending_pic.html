<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display Base64 Image</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1>Base64 Image Display</h1>
<img id="displayImage" src="" alt="Your image" style="display:none; max-width: 200px;">

<script>
$(document).ready(function() {
    // 发起AJAX请求获取Base64编码的图片数据
    $.getJSON('/list_files', function(data) {
        var imgElement = $('#displayImage');
        imgElement.attr('src', 'data:image/jpeg;base64,' + data.imagedate); // 假设是JPEG格式
        
        imgElement.css('display', 'block');
    }).fail(function() {
        alert("Failed to load the image.");
    });
});
</script>

</body>
</html>
