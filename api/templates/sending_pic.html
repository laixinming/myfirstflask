<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Image</title>
</head>
<body>
    <h1>Streamed Image</h1>
    <img id="streamedImage" alt="Streamed Image">

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imgElement = document.getElementById('streamedImage');

            fetch('/list_files')  // 请根据实际情况调整URL
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.blob();  // 将响应转换为Blob对象
                })
                .then(blob => {
                    const url = URL.createObjectURL(blob);  // 创建Blob对象的URL
                    imgElement.src = url;  // 设置图片源
                })
                .catch(error => {
                    console.error('There has been a problem with your fetch operation:', error);
                });
        });
    </script>
</body>
</html>
