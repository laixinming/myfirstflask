<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>分块下载示例</title>
</head>
<body>
    <h1>分块下载示例</h1>
    <button id="downloadButton">开始下载</button>
    <progress id="downloadProgress" value="0" max="100"></progress>

    <script>
        document.getElementById('downloadButton').addEventListener('click', function() {
            const url = '/list_files';
            const chunkSize = 1024 * 1024 * 5; // 每次请求5MB
            const chunks = [];
            let start = 0;
            let totalSize = null;
            let xhr = null;
            let abort = false;

            function downloadChunk(start, end) {
                xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.setRequestHeader('Range', `bytes=${start}-${end}`);
                xhr.responseType = 'arraybuffer';
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const blob = new Blob([this.response], {type: 'application/octet-stream'});
                        chunks.push(blob);
                        updateProgress((start / totalSize) * 100);

                        if (start < totalSize - 1) {
                            start = end + 1;
                            const nextEnd = Math.min(start + chunkSize - 1, totalSize - 1);
                            downloadChunk(start, nextEnd);
                        } else {
                            mergeBlobsAndDownload(chunks);
                        }
                    } else {
                        console.error('Error downloading chunk:', xhr.status);
                    }
                };
                xhr.onerror = function() {
                    console.error('Network error occurred.');
                };
                xhr.onprogress = function(e) {
                    if (e.lengthComputable) {
                        updateProgress(((start + e.loaded) / totalSize) * 100);
                    }
                };
                xhr.send();
            }

            function mergeBlobsAndDownload(blobs) {
                const blob = new Blob(blobs, {type: 'application/octet-stream'});
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'largefile.mp4';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 0);
            }

            function updateProgress(percentage) {
                document.getElementById('downloadProgress').value = percentage;
            }

            xhr.open('HEAD', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    totalSize = parseInt(xhr.getResponseHeader('Content-Length'), 10);
                    const end = Math.min(start + chunkSize - 1, totalSize - 1);
                    downloadChunk(start, end);
                }
            };
            xhr.send();
        });
    </script>
</body>
</html>
