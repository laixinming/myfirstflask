<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download File in Chunks</title>
</head>
<body>
    <button id="downloadButton">点击下载文件</button>

    <script>
        document.getElementById('downloadButton').addEventListener('click', function() {
            const chunkSize = 1024 * 1024; // 每次请求 1MB
            let currentChunkStart = 0;
            let fileContent = new Uint8Array();
            let totalLength = null;

            async function fetchChunk(start, end) {
                const response = await fetch('/download', {
                    headers: {
                        Range: `bytes=${start}-${end}`
                    }
                });

                if (response.status === 206) {
                    const chunk = await response.arrayBuffer();
                    const chunkArray = new Uint8Array(chunk);
                    fileContent.set(chunkArray, start);
                    return true;
                } else if (response.status === 416) {
                    // 文件已完整下载
                    console.log("文件已完整下载");
                    return false;
                } else {
                    throw new Error(`Failed to fetch chunk ${start}-${end}: ${response.statusText}`);
                }
            }

            async function downloadFile() {
                try {
                    while (true) {
                        const end = Math.min(currentChunkStart + chunkSize - 1, totalLength - 1);
                        const result = await fetchChunk(currentChunkStart, end);
                        if (!result) break;
                        currentChunkStart = end + 1;
                    }

                    // 创建 Blob 并下载文件
                    const blob = new Blob([fileContent], {type: 'application/octet-stream'});
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'downloadedfile.ext';
                    link.click();
                    window.URL.revokeObjectURL(url);
                } catch (error) {
                    console.error(error);
                }
            }

            // 获取文件长度
            fetch('/download', {
                method: 'HEAD'
            }).then(response => {
                totalLength = parseInt(response.headers.get('Content-Length'));
                downloadFile();
            });
        });
    </script>
</body>
</html>
