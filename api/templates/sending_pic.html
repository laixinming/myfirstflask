<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Download Example</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <button id="downloadButton">Download File</button>

    <script>
        $(document).ready(function() {
            $('#downloadButton').click(function() {
                var url = '/download';
                var xhr;

                // 模拟已经下载的部分，这里只是示例，实际应用中应该根据已下载部分设置
                var downloadedPart = 0; // 假设已经下载了0字节

                // 发起 AJAX 请求
                xhr = $.ajax({
                    url: url,
                    method: 'GET',
                    headers: {
                        'Range': 'bytes=' + downloadedPart + '-'
                    },
                    xhr: function() {
                        // 这里创建一个新的 XHR 对象
                        var myXhr = $.ajaxSettings.xhr();
                        if (myXhr.upload) { // 浏览器兼容性检查
                            myXhr.upload.addEventListener('progress', function(e) {
                                if (e.lengthComputable) {
                                    var percentComplete = e.loaded / e.total;
                                    console.log('Download progress: ' + Math.round(percentComplete * 100) + '%');
                                }
                            }, false);
                        }
                        return myXhr;
                    },
                    success: function(response, textStatus, jqXHR) {
                        console.log('Download completed!');
                        // 这里处理下载完成后的逻辑
                        // 可以保存到本地文件系统
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        console.error('Error while downloading: ' + errorThrown);
                    }
                });
            });
        });
    </script>
</body>
</html>
