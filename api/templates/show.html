<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>划屏画廊 · 可删除 · 链接即内容</title>
    <!-- marked 轻量 markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #121212;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow: hidden;
            touch-action: pan-y pinch-zoom; 
        }

        /* 主滑动容器 — 横向分页卡片 */
        .cards-container {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            gap: 0;
            height: 95dvh;
            width: 100%;
            max-width: 480px;  /* 卡片适中宽度，类似手机卡片 */
            background: #1e1e1e;
            border-radius: 32px 32px 24px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;  /* 隐藏滚动条 Firefox */
            white-space: nowrap;
        }

        .cards-container::-webkit-scrollbar {
            display: none;  /* 隐藏滚动条 Chrome/Safari */
        }

        /* 单个卡片 — 占满视口宽度 */
        .card {
            flex: 0 0 100%;
            scroll-snap-align: start;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border-radius: 24px;
            padding: 16px 16px 16px 16px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.05);
            color: #f0f0f0;
            overflow-y: auto;  /* 卡片内部垂直滚动 (内容过多时) */
            white-space: normal;
            position: relative;
        }

        /* 卡片头部：索引 + 删除按钮 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }
        .card-index {
            font-size: 14px;
            color: #9a9a9a;
            letter-spacing: 0.5px;
            background: #2c2c2c;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #3f3f3f;
        }
        .delete-card-btn {
            background: #2c2c2c;
            border: 1px solid #5a3e3e;
            color: #ff8a8a;
            width: 42px;
            height: 42px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1;
        }
        .delete-card-btn:active {
            background: #4a2e2e;
            border-color: #ff6b6b;
            color: #ffc5c5;
            transform: scale(0.92);
        }

        /* 三个媒体区域块 */
        .media-block {
            position: relative;
            background: #2a2a2a;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid #3c3c3c;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
            min-height: 150px;
        }

        .card-image {
            flex: 1.2;
            max-height: 28%;
        }
        .card-video {
            flex: 1.5;
            max-height: 32%;
        }
        .card-markdown {
            flex: 2.2;
            min-height: 150px;
            margin-bottom: 0;
        }

        /* 加号占位符 (可点击) */
        .plus-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 56px;
            font-weight: 300;
            color: #888;
            background: #2a2a2a;
            border-radius: 20px;
            transition: background 0.2s;
            cursor: pointer;
            min-height: 140px;
        }
        .plus-placeholder span {
            font-size: 18px;
            margin-top: 8px;
            color: #aaa;
        }
        .plus-placeholder:active {
            background: #3a3a3a;
        }

        /* 图片、视频、markdown内容容器 */
        .media-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #1f1f1f;
        }
        .media-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            background: #2d2d2d;
        }
        .media-content video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #181818;
            border-radius: 18px;
        }

        /* markdown 渲染区 */
        .markdown-body {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 16px 14px;
            background: #252525;
            border-radius: 18px;
            color: #e6e6e6;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            scrollbar-width: thin;
            white-space: normal;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #ffb86b;
            margin: 0.3em 0;
        }
        .markdown-body p {
            margin: 0.6em 0;
        }
        .markdown-body a {
            color: #8be9fd;
        }
        .markdown-body code {
            background: #3d3d3d;
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* 加载/错误占位 */
        .message-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #aaa;
            font-style: italic;
            background: #2a2a2a;
            border-radius: 18px;
            padding: 12px;
        }

        /* 编辑小图标 (悬浮右上，点击修改链接) */
        .edit-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 38px;
            height: 38px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .edit-icon:active {
            background: rgba(120, 120, 120, 0.9);
            transform: scale(0.92);
        }
        .edit-icon::before {
            content: "✎";
            font-size: 22px;
            line-height: 1;
        }

        /* 空区域不显示编辑图标 */
        .media-block.empty .edit-icon {
            display: none;
        }

        .hint-note {
            text-align: center;
            color: #6f6f6f;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="cards-container" id="cardsContainer"></div>
    <script>
        (function() {
            // ----- 核心状态 -----
            const CONTAINER = document.getElementById('cardsContainer');
            let cards = [];               // 卡片数组: { id, imageUrl, videoUrl, markdownUrl, markdownHtml }
            let nextId = 1000;

            // 创建一个空白卡片 (三个加号)
            function createEmptyCard() {
                return {
                    id: nextId++,
                    imageUrl: null,
                    videoUrl: null,
                    markdownUrl: null,
                    markdownHtml: ''
                };
            }

            // 初始化：至少一张空白卡片
            cards = [createEmptyCard()];

            // ----- 辅助：HTML转义 (防止XSS) -----
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // ----- 获取卡片索引 -----
            function findCardIndex(cardId) {
                return cards.findIndex(c => c.id === cardId);
            }

            // ----- 重新渲染所有卡片 (全量重建) -----
            function renderAllCards() {
                let htmlStr = '';
                cards.forEach(card => {
                    htmlStr += renderCardToString(card);
                });
                CONTAINER.innerHTML = htmlStr;

                // 对每个卡片的每个区域填充具体内容 (由数据驱动)
                cards.forEach(card => {
                    renderSingleField(card.id, 'imageUrl');
                    renderSingleField(card.id, 'videoUrl');
                    renderSingleField(card.id, 'markdownUrl');
                });
            }

            // 生成卡片框架 (头部 + 三个空区域容器)
            function renderCardToString(card) {
                return `
                    <div class="card" data-card-id="${card.id}">
                        <div class="card-header">
                            <span class="card-index">#${cards.findIndex(c => c.id === card.id) + 1}</span>
                            <span class="delete-card-btn" data-action="delete" data-card-id="${card.id}" title="删除整组">🗑️</span>
                        </div>
                        <div class="media-block card-image" data-field-container="imageUrl" data-card-id="${card.id}"></div>
                        <div class="media-block card-video" data-field-container="videoUrl" data-card-id="${card.id}"></div>
                        <div class="media-block card-markdown" data-field-container="markdownUrl" data-card-id="${card.id}"></div>
                    </div>
                `;
            }

            // 渲染单个卡片内的某个字段区域 (根据数据更新对应block)
            function renderSingleField(cardId, field) {
                const card = cards.find(c => c.id === cardId);
                if (!card) return;

                const cardElement = document.querySelector(`.card[data-card-id="${cardId}"]`);
                if (!cardElement) return;

                let blockElement = null;
                if (field === 'imageUrl') blockElement = cardElement.querySelector('.card-image');
                else if (field === 'videoUrl') blockElement = cardElement.querySelector('.card-video');
                else if (field === 'markdownUrl') blockElement = cardElement.querySelector('.card-markdown');
                if (!blockElement) return;

                const url = card[field];
                const isMarkdown = (field === 'markdownUrl');

                // 空状态：显示加号占位
                if (!url) {
                    blockElement.classList.add('empty');
                    blockElement.innerHTML = `
                        <div class="plus-placeholder" data-field="${field}" data-card-id="${cardId}">
                            <div>➕</div>
                            <span>添加 ${field === 'imageUrl' ? '图片' : (field === 'videoUrl' ? '视频' : 'Markdown')}</span>
                        </div>
                    `;
                    return;
                }

                // 有链接：显示内容 + 编辑图标
                blockElement.classList.remove('empty');
                let contentHtml = '';

                if (field === 'imageUrl') {
                    contentHtml = `<img src="${escapeHtml(url)}" alt="image" loading="lazy" onerror="this.style.opacity=0.5; this.alt='❌加载失败'">`;
                } else if (field === 'videoUrl') {
                    contentHtml = `<video src="${escapeHtml(url)}" controls playsinline preload="metadata" onerror="this.outerHTML='<div class=\'message-placeholder\'>❌ 视频无法加载</div>'">你的浏览器不支持video</video>`;
                } else if (field === 'markdownUrl') {
                    // 如果有缓存的html则直接显示，否则显示加载中并fetch
                    if (card.markdownHtml) {
                        contentHtml = `<div class="markdown-body">${card.markdownHtml}</div>`;
                    } else {
                        contentHtml = `<div class="message-placeholder" data-markdown-loading="${cardId}">⌛ 加载Markdown...</div>`;
                        // 异步获取markdown
                        fetchMarkdownAndRender(card, blockElement);
                    }
                }

                blockElement.innerHTML = `
                    <div class="media-content">
                        ${contentHtml}
                        <div class="edit-icon" data-field="${field}" data-card-id="${cardId}" title="修改链接"></div>
                    </div>
                `;
            }

            // 异步获取markdown并更新卡片
            async function fetchMarkdownAndRender(card, blockElement) {
                const url = card.markdownUrl;
                if (!url) return;
                try {
                    const response = await fetch(url, { mode: 'cors', credentials: 'omit' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    const html = marked.parse(text, { mangle: false, headerIds: false });
                    card.markdownHtml = html;

                    // 重新渲染该区域 (此时已缓存html)
                    const freshBlock = document.querySelector(`.card[data-card-id="${card.id}"] .card-markdown`);
                    if (freshBlock) {
                        freshBlock.innerHTML = `
                            <div class="media-content">
                                <div class="markdown-body">${html}</div>
                                <div class="edit-icon" data-field="markdownUrl" data-card-id="${card.id}"></div>
                            </div>
                        `;
                    }
                } catch (err) {
                    console.warn('markdown加载失败', err);
                    card.markdownHtml = '';  // 避免缓存错误
                    const errorBlock = document.querySelector(`.card[data-card-id="${card.id}"] .card-markdown .media-content`);
                    if (errorBlock) {
                        errorBlock.innerHTML = `
                            <div class="message-placeholder">⚠️ 加载失败，点击✎重试</div>
                            <div class="edit-icon" data-field="markdownUrl" data-card-id="${card.id}"></div>
                        `;
                    }
                }
            }

            // ----- 更新卡片字段（核心修改入口）-----
            function setCardField(cardId, field, newUrl) {
                const idx = findCardIndex(cardId);
                if (idx === -1) return;
                const card = cards[idx];

                // 相同值不处理
                if (card[field] === newUrl) return;

                // 更新字段
                if (field === 'imageUrl' || field === 'videoUrl') {
                    card[field] = newUrl;
                } else if (field === 'markdownUrl') {
                    card[field] = newUrl;
                    card.markdownHtml = '';  // 清除缓存，重新获取
                }

                // 重新渲染对应区域
                renderSingleField(cardId, field);

                // 检查并自动追加新卡片 (如果最后一个卡片完整)
                maybeAppendNewCard(cardId);
            }

            // 自动添加空白卡片：当更新的卡片是最后一张，且三个字段都已填满，则新增空白卡片
            function maybeAppendNewCard(updatedCardId) {
                const lastCard = cards[cards.length - 1];
                if (lastCard.id !== updatedCardId) return;

                // 检查最后一张卡是否三个字段都有值
                if (lastCard.imageUrl && lastCard.videoUrl && lastCard.markdownUrl) {
                    cards.push(createEmptyCard());
                    renderAllCards();
                    // 平滑滚动到新卡片
                    setTimeout(() => {
                        const newIndex = cards.length - 1;
                        CONTAINER.scrollTo({
                            left: newIndex * CONTAINER.clientWidth,
                            behavior: 'smooth'
                        });
                    }, 50);
                }
            }

            // ----- 删除卡片 -----
            function deleteCard(cardId) {
                const idx = findCardIndex(cardId);
                if (idx === -1) return;

                // 删除卡片
                cards.splice(idx, 1);

                // 如果一张卡片都不剩，则添加一个空白卡片
                if (cards.length === 0) {
                    cards.push(createEmptyCard());
                }

                // 重新渲染所有卡片
                renderAllCards();

                // 尝试将滚动位置调整到刚才删除的那一页 (如果删除后索引存在)
                let targetIndex = idx;
                if (targetIndex >= cards.length) targetIndex = cards.length - 1;
                if (targetIndex < 0) targetIndex = 0;

                // 等待DOM更新后滚动
                setTimeout(() => {
                    CONTAINER.scrollTo({
                        left: targetIndex * CONTAINER.clientWidth,
                        behavior: 'smooth'
                    });
                }, 30);
            }

            // ----- 全局事件委托 (处理所有点击：加号、编辑图标、删除按钮) -----
            function setupEventDelegation() {
                CONTAINER.addEventListener('click', (e) => {
                    // 删除按钮 (垃圾桶)
                    if (e.target.closest('.delete-card-btn')) {
                        const btn = e.target.closest('.delete-card-btn');
                        const cardId = Number(btn.dataset.cardId);
                        if (confirm('确定删除这组内容吗？')) {
                            deleteCard(cardId);
                        }
                        e.preventDefault();
                        return;
                    }

                    // 加号占位 (plus-placeholder) 或者 编辑图标 (edit-icon)
                    const plus = e.target.closest('.plus-placeholder');
                    const edit = e.target.closest('.edit-icon');

                    let field = null;
                    let cardId = null;

                    if (plus) {
                        field = plus.dataset.field;
                        cardId = Number(plus.dataset.cardId);
                    } else if (edit) {
                        field = edit.dataset.field;
                        cardId = Number(edit.dataset.cardId);
                    } else {
                        return; // 无关点击
                    }

                    if (!field || !cardId) return;

                    // 阻止事件冒泡/默认行为
                    e.preventDefault();

                    // 根据字段弹出对应提示
                    const fieldNames = {
                        imageUrl: '图片链接 (直接图片地址, 如 https://...jpg)',
                        videoUrl: '视频链接 (支持.mp4等, 如 https://...mp4)',
                        markdownUrl: 'Markdown文件链接 (.md 文件地址)'
                    };
                    const currentCard = cards.find(c => c.id === cardId);
                    const currentUrl = currentCard ? currentCard[field] : '';
                    const promptMsg = `输入${fieldNames[field]}:\n(留空或取消则不变更)`;

                    let newUrl = prompt(promptMsg, currentUrl || '');
                    if (newUrl === null) return; // 取消

                    newUrl = newUrl.trim();
                    if (newUrl === '') {
                        // 如果用户清空，则置null
                        newUrl = null;
                    }

                    setCardField(cardId, field, newUrl);
                });
            }

            // 首次渲染
            renderAllCards();
            setupEventDelegation();

            // 可选：监听resize保证滚动位置不崩 (每次旋转/缩放后重新校准scroll?)
            // 简单起见，不做复杂处理

            // 额外优化: 滑动后如果发现最后一个卡片完整，自动追加 (但追加已经在setCardField里检查)
            // 但手动滑动不会触发追加，保持原逻辑：只有通过加号/编辑更新内容后才追加
        })();
    </script>
</body>
</html>
